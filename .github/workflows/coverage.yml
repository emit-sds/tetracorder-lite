name: Post coverage comment

# Posts the coverage comment built by the Build workflow's pytests job. Fork PRs only get a
# read-only token, so that job can't comment itself; this runs afterwards in the base
# repository's context with write access.
#
# Safe because it never checks out or runs PR code: it only downloads the comment artifact
# and posts it. Note that workflow_run only fires for the version of this file on main.
on:  # zizmor: ignore[dangerous-triggers] see above
  workflow_run:
    workflows: ["Build"]
    types: [completed]

concurrency:
  # github.ref is always the default branch on workflow_run, so group by the PR branch
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    name: Post coverage comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write # Post the comment, and edit it on later runs
      actions: read # Download the comment artifact from the Build run
      contents: read
    steps:
      # Do NOT add actions/checkout here: this job has write access and the PR is untrusted
      - name: Post comment
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
