name: Build

on:
  pull_request:
    branches-ignore: ["gh-pages"]
    paths: ["tetrapy/**", "tests/**", "pyproject.toml", "uv.lock", ".github/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Test building the package
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.25"
          python-version: "3.12"
          enable-cache: true
          prune-cache: false
          cache-suffix: package

      - name: Build package
        shell: bash
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tetrapy --version

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz tetrapy --version

  # Unit tests + the synthetic end-to-end pipeline run (no container needed)
  pytests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.25"
          python-version: "3.12"
          enable-cache: true
          prune-cache: false
          cache-suffix: pytests

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytests
        run: uv run pytest -v --cov --cov-report=term --cov-report=xml --cov-report=html

      # Coverage table on the run's summary page, even if tests failed
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14
