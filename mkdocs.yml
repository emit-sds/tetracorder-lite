site_name: tetracorder-lite
site_url: https://emit-sds.github.io/tetracorder-lite/
repo_name: emit-sds/tetracorder-lite
repo_url: https://github.com/emit-sds/tetracorder-lite/
docs_dir: docs/
# Fail the build on any warning (a nav page missing from docs/, a broken
# cross-reference) instead of publishing a site without it.
strict: true
theme:
  name: material
  palette:
    # Palette toggle for automatic mode (light during day, dark during night)
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.expand
    - navigation.path
plugins:
  - search
  - mkapi
  - social
markdown_extensions:
  - attr_list
  - md_in_html            # card grid on the landing page
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:       # :material-...: icons
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:    # embeds config.yml into configuration.md
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: "#"
      baselevel: 2
extra_css:
  - stylesheets/icons.css
extra:
  version:
    provider: mike
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
nav:
  - About: index.md
  - Installation: installation.md
  - Running the container: running-the-container.md
  - Pipeline: pipeline.md
  - Configuration: configuration.md
  - Convolved library: convolved-library-build.md
  - Developers:
    - Contributing: developers/contributing.md
    - Documentation: developers/documentation.md
  - Reference:
    - $api/tetrapy.***
