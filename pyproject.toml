[project]
name = "tetrapy"
version = "0.1.0"
description = "..."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.1",
]

[project.scripts]
tetrapy = "tetrapy.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tetrapy"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
tetrapy = { path = ".", editable = true }
emit-utils = { git = "https://github.com/emit-sds/emit-utils.git" }

[tool.pixi.tasks]

# emit-sds-l2b dependencies
[tool.pixi.dependencies]
numpy = ">=1.26"
gdal = ">=3.13.1,<4"
libgdal-core = ">=3.13.1,<4"
pyyaml = ">=6.0.3,<7"
pandas = ">=3.0.3,<4"
scipy = ">=1.18.0,<2"
matplotlib = ">=3.11.0,<4"
pytest = ">=8,<9"
