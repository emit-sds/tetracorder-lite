[project]
name = "tetrapy"
version = "1.1.0"
description = "Containerized USGS Tetracorder (v6) for EMIT mineral identification"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "python-box[all]>=7.4.1",
    "rich>=13.0.0",
    "rioxarray>=0.19.0",
    "scipy>=1.15.3",
    "spectral>=0.25",
    "xarray>=2025.6.1",
]

[project.optional-dependencies]
docs = [
  "mike>=2.1.3",
  "mkapi>=4.5.0",
  "mkdocs>=1.6.1,<2",
  "mkdocs-material[imaging]>=9.7.1",
]

[project.scripts]
tetrapy = "tetrapy.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Synthetic rasters are intentionally ungeoreferenced
    "ignore::rasterio.errors.NotGeoreferencedWarning",
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:dateutil",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.coverage.run]
source = ["tetrapy"]
branch = true
# Required by the PR coverage comment action, which reads .coverage from another path
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    'if __name__ == "__main__":',
]
