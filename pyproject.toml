[project]
name = "tetrapy"
version = "1.1.0"
description = "Containerized USGS Tetracorder (v6) for EMIT mineral identification"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "python-box[all]>=7.4.1",
    "rich>=13.0.0",
    "rioxarray>=0.19.0",
    "scipy>=1.15.3",
    "spectral>=0.25",
    "xarray>=2025.6.1",
]

[project.optional-dependencies]
docs = [
  "mike>=2.1.3",
  "mkapi>=4.5.0",
  "mkdocs>=1.6.1,<2",
  "mkdocs-material[imaging]>=9.7.1",
]

[project.scripts]
tetrapy = "tetrapy.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
